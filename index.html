<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>객실 채널 안내</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="head">
      <div class="eyebrow">HOTEL SOKCHO · ROOM GUIDE</div>
      <h1>객실 채널 안내</h1>
      <p>객실 TV(LG 헬로비전)에서 보실 수 있는 채널 번호를 안내해 드립니다.</p>
    </header>

    <!-- 이미지를 교체하려면 images/channel-1.png ~ channel-7.png 를 같은 이름으로 바꾸면 됩니다. 크기가 바뀌면 width/height 값도 맞춰 주세요. -->
    <main class="guides">
      <article class="guide">
        <div class="guide-head"><span class="badge">01</span><h2>채널 안내 1 / 7</h2></div>
        <div class="card"><img src="images/channel-1.png" width="941" height="1672" loading="eager" alt="LG 헬로비전 채널 안내 1쪽"></div>
        <div class="guide-action"><a class="btn btn-fill" href="images/channel-1.png" data-src="images/channel-1.png" data-title="채널 안내 1 / 7"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></svg>크게 보기</a></div>
      </article>
      <article class="guide">
        <div class="guide-head"><span class="badge">02</span><h2>채널 안내 2 / 7</h2></div>
        <div class="card"><img src="images/channel-2.png" width="941" height="1672" loading="lazy" alt="LG 헬로비전 채널 안내 2쪽"></div>
        <div class="guide-action"><a class="btn btn-fill" href="images/channel-2.png" data-src="images/channel-2.png" data-title="채널 안내 2 / 7"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></svg>크게 보기</a></div>
      </article>
      <article class="guide">
        <div class="guide-head"><span class="badge">03</span><h2>채널 안내 3 / 7</h2></div>
        <div class="card"><img src="images/channel-3.png" width="941" height="1672" loading="lazy" alt="LG 헬로비전 채널 안내 3쪽"></div>
        <div class="guide-action"><a class="btn btn-fill" href="images/channel-3.png" data-src="images/channel-3.png" data-title="채널 안내 3 / 7"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></svg>크게 보기</a></div>
      </article>
      <article class="guide">
        <div class="guide-head"><span class="badge">04</span><h2>채널 안내 4 / 7</h2></div>
        <div class="card"><img src="images/channel-4.png" width="941" height="1672" loading="lazy" alt="LG 헬로비전 채널 안내 4쪽"></div>
        <div class="guide-action"><a class="btn btn-fill" href="images/channel-4.png" data-src="images/channel-4.png" data-title="채널 안내 4 / 7"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></svg>크게 보기</a></div>
      </article>
      <article class="guide">
        <div class="guide-head"><span class="badge">05</span><h2>채널 안내 5 / 7</h2></div>
        <div class="card"><img src="images/channel-5.png" width="941" height="1672" loading="lazy" alt="LG 헬로비전 채널 안내 5쪽"></div>
        <div class="guide-action"><a class="btn btn-fill" href="images/channel-5.png" data-src="images/channel-5.png" data-title="채널 안내 5 / 7"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></svg>크게 보기</a></div>
      </article>
      <article class="guide">
        <div class="guide-head"><span class="badge">06</span><h2>채널 안내 6 / 7</h2></div>
        <div class="card"><img src="images/channel-6.png" width="941" height="1672" loading="lazy" alt="LG 헬로비전 채널 안내 6쪽"></div>
        <div class="guide-action"><a class="btn btn-fill" href="images/channel-6.png" data-src="images/channel-6.png" data-title="채널 안내 6 / 7"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></svg>크게 보기</a></div>
      </article>
      <article class="guide">
        <div class="guide-head"><span class="badge">07</span><h2>채널 안내 7 / 7</h2></div>
        <div class="card"><img src="images/channel-7.png" width="941" height="1672" loading="lazy" alt="LG 헬로비전 채널 안내 7쪽"></div>
        <div class="guide-action"><a class="btn btn-fill" href="images/channel-7.png" data-src="images/channel-7.png" data-title="채널 안내 7 / 7"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5M11 8v6M8 11h6"/></svg>크게 보기</a></div>
      </article>
    </main>

    <footer class="foot">
      <p>도움이 필요하시면 프론트로 연락해 주세요.<br><strong class="ext">내선 201#~203#</strong></p>
    </footer>
  </div>

  <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true">
    <div class="viewer-bar">
      <span class="viewer-title"></span>
      <button class="viewer-close" type="button" aria-label="닫기"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="viewer-body"><img alt=""></div>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
